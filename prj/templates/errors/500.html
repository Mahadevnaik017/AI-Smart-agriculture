{% extends 'base.html' %}

{% block title %}Internal Server Error (500) – Mojara{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
  <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: #c62828; margin-bottom: 1rem;"></i>
  <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 0.5rem;">500 - Server Error</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    An unexpected server error occurred. The system log has recorded this incident.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn-mojara btn-primary-mojara">
    <i class="fa-solid fa-house"></i> Return to Homepage &rarr;
  </a>
</div>
{% endblock %}
