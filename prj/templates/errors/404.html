{% extends 'base.html' %}

{% block title %}Page Not Found (404) – Mojara{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
  <i class="fa-solid fa-wheat-awn-circle-exclamation" style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;"></i>
  <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 0.5rem;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    The requested agricultural page or resource could not be found.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn-mojara btn-primary-mojara">
    <i class="fa-solid fa-house"></i> Return to Homepage &rarr;
  </a>
</div>
{% endblock %}
