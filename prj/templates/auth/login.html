{% extends 'base.html' %}

{% block title %}Sign In – Mojara Agriculture Platform{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-card" style="padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <i class="fa-solid fa-wheat-awn-circle-exclamation" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem;"></i>
      <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--primary-dark);">Sign In to Mojara</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted);">Access your agricultural portal & marketplace account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="login_email" name="email" required placeholder="farmer@mojara.org" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login_password" name="password" required placeholder="••••••••" class="form-control">
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-size: 0.85rem; font-weight: 500; cursor: pointer;">
          <input type="checkbox" name="remember"> Remember Me
        </label>
        <a href="#" style="font-size: 0.85rem;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-mojara btn-primary-mojara" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
        Sign In &rarr;
      </button>
    </form>

    <!-- Quick Demo Buttons -->
    <div style="margin-top: 1.75rem; border-top: 1px solid var(--card-border); padding-top: 1.25rem;">
      <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; text-align: center; margin-bottom: 0.75rem;">
        Click to Autofill Demo Credentials:
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;">
        <button onclick="document.getElementById('login_email').value='farmer@mojara.org'; document.getElementById('login_password').value='farmer123';" class="btn-mojara btn-secondary-mojara" style="font-size: 0.78rem; padding: 0.4rem;">
          <i class="fa-solid fa-seedling"></i> Farmer Account
        </button>
        <button onclick="document.getElementById('login_email').value='buyer@mojara.org'; document.getElementById('login_password').value='buyer123';" class="btn-mojara btn-secondary-mojara" style="font-size: 0.78rem; padding: 0.4rem;">
          <i class="fa-solid fa-cart-shopping"></i> Buyer Account
        </button>
        <button onclick="document.getElementById('login_email').value='officer@mojara.org'; document.getElementById('login_password').value='officer123';" class="btn-mojara btn-secondary-mojara" style="font-size: 0.78rem; padding: 0.4rem;">
          <i class="fa-solid fa-user-shield"></i> Officer Account
        </button>
        <button onclick="document.getElementById('login_email').value='admin@mojara.org'; document.getElementById('login_password').value='admin123';" class="btn-mojara btn-primary-mojara" style="font-size: 0.78rem; padding: 0.4rem;">
          <i class="fa-solid fa-gauge-high"></i> Admin Account
        </button>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 700;">Create One Here</a>
    </div>
  </div>
</div>
{% endblock %}
